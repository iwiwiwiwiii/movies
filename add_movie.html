<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Добавление материала</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="sidebar">
    <div class="logo">MyMovies <span>DB</span></div>
    <a href="index.html">Фильмы</a>
    <a href="add_movie.html">Добавить</a>
    <a href="plans.html">Планы</a>
</nav>
    <div class="main-content">
        <header>Добавление материала</header>
        <main class="content-area">
            <div class="form-container">
                <div class="row">
                    <div class="field">
                        <label>Название фильма,сериала,мультфильма</label>
                        <input type="text" placeholder="Введите название">
                    </div>
                    <div class="field">
                        <label>Год выпуска</label>
                        <input type="number" value="2024">
                    </div>
                </div>
                <div class="row">
                    <div class="field">
                        <label>Жанр</label>
                        <input type="text" placeholder="Ужасы, триллер">
                    </div>
                    <div class="field">
                        <label>Статус просмотра</label>
                        <select>
                            <option>В планах</option>
                            <option>Смотрю</option>
                        </select>
                    </div>
                </div>
                <div class="field">
                    <label>Описание сюжета</label>
                    <textarea rows="5" placeholder="О чем этот фильм?"></textarea>
                </div>
                <button class="save-btn">Сохранить</button>
            </div>
        </main>
    </div>
</body>
</html>
